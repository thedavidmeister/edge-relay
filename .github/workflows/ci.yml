name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: rustfmt
        run: nix develop --command cargo fmt --all --check

      - name: clippy (native, deny warnings)
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: test (native)
        run: nix develop --command cargo test --all-targets

      - name: coverage (fail under 100% on pure logic)
        run: |
          nix develop --command cargo tarpaulin \
            --engine ptrace \
            --out Stdout --out Xml \
            --fail-under 100 \
            --exclude-files 'src/glue.rs'

      - name: wasm build (worker compiles to wasm32)
        run: nix develop --command cargo build --release --target wasm32-unknown-unknown

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cobertura.xml
          if-no-files-found: ignore
