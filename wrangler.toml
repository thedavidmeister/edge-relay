name = "edge-relay"
main = "build/worker/shim.mjs"
compatibility_date = "2025-06-01"

# Rust workers are compiled to WASM by worker-build during `wrangler deploy`.
# worker-build is provided by the nix dev shell (or `cargo install worker-build`).
[build]
command = "worker-build --release"

# Secrets (set with `wrangler secret put <NAME>`, never commit these):
#   BOT_TOKEN        - Telegram bot token from @BotFather
#   TG_WEBHOOK_SECRET- random string; checked against X-Telegram-Bot-Api-Secret-Token
#   LOVENSE_TOKEN    - Lovense developer token
#   ALLOWED_USER_ID  - your Telegram numeric user id (only this user may send commands)
#
# Plain vars (safe to commit) can go here.
# LOVENSE_API_BASE / TELEGRAM_API_BASE default to the real endpoints when unset;
# the integration test overrides them to point the worker at a stub server.
[vars]
LOVENSE_UID = "gf"
