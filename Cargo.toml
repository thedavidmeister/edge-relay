[package]
name = "edge-relay"
version = "0.1.0"
edition = "2021"
authors = ["David Meister <thedavidmeister@gmail.com>"]
license = "MIT"
repository = "https://github.com/thedavidmeister/edge-relay"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.4"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
